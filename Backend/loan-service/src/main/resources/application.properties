spring.application.name=loan-service
server.port=8085

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/finguard_loan}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

eureka.instance.prefer-ip-address=true
eureka.instance.hostname=localhost
eureka.instance.instance-id=${spring.application.name}:${server.port}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
info.app.name=FinGuard Loan Service
info.app.version=1.0.0
info.app.description=Enterprise Banking Microservices Application
management.info.env.enabled=true
management.endpoints.web.exposure.include=health,info,metrics,prometheus,circuitbreakers
management.endpoint.health.show-details=always
management.metrics.tags.application=${spring.application.name}