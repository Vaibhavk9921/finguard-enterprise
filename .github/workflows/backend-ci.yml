name: FinGuard Backend CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

  
jobs:

  auth-service:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Backend/auth-service

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - run: chmod +x gradlew

      - run: ./gradlew clean build

      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io/vaibhavk9921/auth-service:latest

      - name: Build Docker Image
        if: github.event_name == 'push'
        run: docker build -t ghcr.io/${{ github.repository_owner }}/auth-service:latest .

      - name: Push Docker Image
        if: github.event_name == 'push'
        run: docker push ghcr.io/${{ github.repository_owner }}/auth-service:latest

