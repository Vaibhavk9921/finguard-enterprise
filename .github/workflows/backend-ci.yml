name: FinGuard Backend CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - auth-service
          - user-service
          - transaction-service
          - loan-service
          - notification-service
          - api-gateway
          - eureka-server

    defaults:
      run:
        working-directory: Backend/${{ matrix.service }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Grant Execute Permission
        run: chmod +x gradlew

      - name: Build Project
        run: ./gradlew clean build

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker Image
        if: github.event_name == 'push'
        run: |
          docker build \
            -t ghcr.io/vaibhavk9921/${{ matrix.service }}:latest \
            .

      - name: Push Docker Image
        if: github.event_name == 'push'
        run: |
          docker push ghcr.io/vaibhavk9921/${{ matrix.service }}:latest