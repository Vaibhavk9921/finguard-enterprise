name: FinGuard Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  auth-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend/auth-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: chmod +x gradlew
      - run: ./gradlew clean build

  user-service:
    runs-on: ubuntu-latest
    defaults:
